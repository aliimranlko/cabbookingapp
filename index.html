<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cab Booking System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Cab Booking System</h1>
    <button onclick="testConnection()">Test Connection</button>
    <button onclick="addSampleEmployee()">Add Sample Employee</button>
    <div id="output"></div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbztj24EfHRceFJSIQ9u5FEVxEAivzdtynefGxlPKHi9whl_qwEO3RuaJR0qRT6si_2R9w/exec'; // Replace with your Google Apps Script Web App URL

        async function testConnection() {
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=test`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    mode: 'cors',
                    credentials: 'omit'
                });
                const result = await response.json();
                document.getElementById('output').innerHTML = `<p class="${result.success ? 'success' : 'error'}">${result.message}</p>`;
            } catch (error) {
                document.getElementById('output').innerHTML = `<p class="error">Failed to fetch: ${error.message}</p>`;
            }
        }

        async function addSampleEmployee() {
            const employeeData = {
                action: 'add',
                sheet: 'employees',
                data: {
                    id: 'EMP004',
                    name: 'Alice Brown',
                    department: 'Marketing',
                    phone: '+1234567895',
                    email: 'alice@company.com',
                    password: 'password123'
                }
            };

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    mode: 'cors',
                    credentials: 'omit',
                    body: JSON.stringify(employeeData)
                });
                const result = await response.json();
                document.getElementById('output').innerHTML = `<p class="${result.success ? 'success' : 'error'}">${result.message}</p>`;
            } catch (error) {
                document.getElementById('output').innerHTML = `<p class="error">Failed to fetch: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
