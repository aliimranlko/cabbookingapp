<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cab Booking System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Cab Booking System</h1>
    <button onclick="testConnection()">Test Connection</button>
    <button onclick="addSampleEmployee()">Add Sample Employee</button>
    <div id="output"></div>

    <script>
        const SHEETDB_API_URL = 'YOUR_SHEETDB_API_URL'; // Replace with your SheetDB API URL (e.g., https://sheetdb.io/api/v1/abcdef123456)

        async function testConnection() {
            try {
                const response = await fetch(`${SHEETDB_API_URL}/employees`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    mode: 'cors',
                    credentials: 'omit'
                });
                const result = await response.json();
                document.getElementById('output').innerHTML = `<p class="success">SheetDB connection successful! Found ${result.length} employees.</p>`;
            } catch (error) {
                document.getElementById('output').innerHTML = `<p class="error">Connection failed: ${error.message}</p>`;
            }
        }

        async function addSampleEmployee() {
            const employeeData = {
                id: 'EMP004',
                name: 'Alice Brown',
                department: 'Marketing',
                phone: '+1234567895',
                email: 'alice@company.com',
                password: 'password123',
                created: new Date().toISOString()
            };

            try {
                const response = await fetch(`${https://sheetdb.io/api/v1/vxo4hnejxx9sa}/employees`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    mode: 'cors',
                    credentials: 'omit',
                    body: JSON.stringify([employeeData])
                });
                const result = await response.json();
                document.getElementById('output').innerHTML = `<p class="success">Employee added successfully!</p>`;
            } catch (error) {
                document.getElementById('output').innerHTML = `<p class="error">Failed to add employee: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
