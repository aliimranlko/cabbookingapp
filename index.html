<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cab Booking System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Cab Booking System</h1>
    <button onclick="testConnection()">Test Connection</button>
    <button onclick="addSampleEmployee()">Add Sample Employee</button>
    <div id="output"></div>

    <script>
        const SHEETDB_API_URL = 'https://sheetdb.io/api/v1/vxo4hnejxx9sa';

        async function testConnection() {
            try {
                // Test root API endpoint to verify SheetDB connection
                const response = await fetch(SHEETDB_API_URL, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    mode: 'cors',
                    credentials: 'omit'
                });
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`HTTP ${response.status}: ${text}`);
                }
                const result = await response.json();
                document.getElementById('output').innerHTML = '<p class="success">SheetDB connection successful! API response: ' + JSON.stringify(result) + '</p>';

                // Test employees endpoint
                const empResponse = await fetch(`${SHEETDB_API_URL}/employees`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    mode: 'cors',
                    credentials: 'omit'
                });
                if (!empResponse.ok) {
                    const text = await empResponse.text();
                    throw new Error(`Employees endpoint HTTP ${empResponse.status}: ${text}`);
                }
                const empResult = await empResponse.json();
                document.getElementById('output').innerHTML += '<p class="success">Found ' + empResult.length + ' employees.</p>';
            } catch (error) {
                document.getElementById('output').innerHTML = '<p class="error">Connection failed: ' + error.message + '</p>';
            }
        }

        async function addSampleEmployee() {
            const employeeData = {
                ID: 'EMP004',
                Name: 'Alice Brown',
                Department: 'Marketing',
                Phone: '+1234567895',
                Email: 'alice@company.com',
                Password: 'password123',
                Created: new Date().toISOString()
            };

            try {
                const response = await fetch(`${SHEETDB_API_URL}/employees`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    mode: 'cors',
                    credentials: 'omit',
                    body: JSON.stringify([employeeData])
                });
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`HTTP ${response.status}: ${text}`);
                }
                const result = await response.json();
                document.getElementById('output').innerHTML = '<p class="success">Employee added successfully!</p>';
            } catch (error) {
                document.getElementById('output').innerHTML = '<p class="error">Failed to add employee: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
